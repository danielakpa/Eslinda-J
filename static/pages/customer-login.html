<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Eslinda-J</title>
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>

  <h2>Login to Your Account</h2>
  
<form id="login-form">
  <input type="text" name="phone" placeholder="Phone Number" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>

<p id="login-message"></p>

<!-- Hidden until login succeeds -->
<div id="success-box" class="success-box" style="display: none;">
  <div class="checkmark">✔</div>
  <p>Login Successful!</p>
</div>

<p>Don't have an account? <a href="/customer-signup">Create one here</a></p>

<script src="/static/js/customerLogin.js"></script>
</body>
</html>
